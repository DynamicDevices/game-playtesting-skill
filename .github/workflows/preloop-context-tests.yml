name: Native review prompt regressions
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          persist-credentials: false
      - name: Native target prompt contract
        run: python3 -B tests/test_preloop_context_prompt.py
