name: Preloop contract tests
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          persist-credentials: false
      - name: Offline review and publisher regressions
        run: python3 -B -m unittest discover -s .github/preloop -p 'test_*.py' -v
